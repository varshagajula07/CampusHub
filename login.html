<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusHub - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <div class="login-icon">
                🎓
            </div>

            <h1>
                Welcome Back! 👋
            </h1>

            <p>
                Login to your CampusHub account
            </p>


            <input
                type="email"
                placeholder="Enter your email"
            >


            <input
                type="password"
                placeholder="Enter your password"
            >


            <button class="login-submit">
                Login
            </button>


            <p class="signup">
                Don't have an account?
                <a href="#">
                    Sign up
                </a>
            </p>


            <a href="index.html"
               class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
